<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalyan Decorators | Admin CMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen">
<header class="bg-stone-950 text-white px-5 py-5"><div class="max-w-6xl mx-auto flex justify-between items-center"><div><p class="text-amber-400 uppercase tracking-widest text-xs">Private workspace</p><h1 class="font-serif text-2xl">Kalyan Decorators</h1></div><a href="./" class="underline text-sm">View website</a></div></header>
<main class="max-w-6xl mx-auto p-4 md:p-8">
<section id="login" class="max-w-md mx-auto bg-white rounded-2xl p-7 shadow"><h2 class="text-xl font-semibold mb-4">Administrator sign in</h2><form id="loginForm" class="space-y-3"><input id="email" type="email" required placeholder="Admin email" class="w-full border rounded-lg p-3"><input id="password" type="password" required placeholder="Password" class="w-full border rounded-lg p-3"><button class="w-full bg-stone-900 text-white rounded-lg p-3">Sign in</button></form><p id="loginError" class="text-red-700 text-sm mt-3"></p></section>
<section id="app" class="hidden">
<div class="flex justify-between items-center gap-3 mb-6"><div><h2 class="text-2xl font-semibold">Website content manager</h2><p class="text-sm text-stone-500">Changes are saved to Firebase and loaded by the public website.</p></div><button id="logout" class="border bg-white rounded-lg px-4 py-2">Sign out</button></div>
<div class="flex flex-wrap gap-2 mb-5" id="tabs">
<button data-tab="homepage" class="tab bg-stone-900 text-white rounded-lg px-4 py-2">Homepage</button>
<button data-tab="services" class="tab bg-white border rounded-lg px-4 py-2">Services</button>
<button data-tab="gallery" class="tab bg-white border rounded-lg px-4 py-2">Gallery</button>
<button data-tab="catalog" class="tab bg-white border rounded-lg px-4 py-2">Packages & decor</button>
<button data-tab="about" class="tab bg-white border rounded-lg px-4 py-2">About us</button>
<button data-tab="enquiries" class="tab bg-white border rounded-lg px-4 py-2">Enquiries</button>
</div>
<div id="notice" class="text-sm mb-4 text-stone-600" role="status"></div>
<section id="editor" class="bg-white rounded-2xl shadow-sm border p-5 md:p-7"></section>
</section></main>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC_xBOGExLfpVkVbx4vDnUg2MTv9z82Ys4",
  authDomain: "kalyan-decorators.firebaseapp.com",
  projectId: "kalyan-decorators",
  storageBucket: "kalyan-decorators.firebasestorage.app",
  messagingSenderId: "579489792336",
  appId: "1:579489792336:web:5e5538d8b6375272642c55",
  measurementId: "G-E94NVE123J"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore(), storage=firebase.storage();
const ADMIN_UID='A873gDM5ZoO52w1BpPTMYePyvzN2';
const login=document.getElementById('login'), app=document.getElementById('app'), notice=document.getElementById('notice'), editor=document.getElementById('editor');
let activeTab='homepage', editingId=null;
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();notice.textContent='Signing in…';try{await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(),document.getElementById('password').value)}catch(err){notice.textContent='Sign-in error: '+err.code+' — '+err.message;}});
document.getElementById('logout').onclick=()=>auth.signOut();
auth.onAuthStateChanged(user=>{const ok=!!user&&user.uid===ADMIN_UID;login.classList.toggle('hidden',ok);app.classList.toggle('hidden',!ok);if(user&&!ok){auth.signOut();document.getElementById('loginError').textContent='This account is not authorized.';}if(ok)showTab(activeTab);});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
function say(s){notice.textContent=s;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function field(label,name,value='',type='text',required=false){return `<label class="block text-sm font-medium mb-3">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} class="mt-1 w-full border rounded-lg p-3 font-normal"></label>`;}
function textarea(label,name,value=''){return `<label class="block text-sm font-medium mb-3">${label}<textarea name="${name}" rows="3" class="mt-1 w-full border rounded-lg p-3 font-normal">${esc(value)}</textarea></label>`;}
function showTab(tab){activeTab=tab;editingId=null;document.querySelectorAll('.tab').forEach(b=>b.className='tab bg-white border rounded-lg px-4 py-2');document.querySelector(`[data-tab="${tab}"]`).className='tab bg-stone-900 text-white rounded-lg px-4 py-2';if(tab==='homepage')homeEditor();else if(tab==='about')aboutEditor();else if(tab==='enquiries')loadEnquiries();else collectionEditor(tab);}
async function homeEditor(){const snap=await db.collection('siteSettings').doc('homepage').get(),d=snap.exists?snap.data():{};editor.innerHTML=`<h3 class="text-xl font-semibold mb-4">Homepage content</h3><form id="homeForm">${field('Main heading','heroTitle',d.heroTitle||'')}${textarea('Subtitle','heroSubtitle',d.heroSubtitle||'')}${field('Banner image URL (optional)','heroImage',d.heroImage||'')}<button class="bg-stone-900 text-white rounded-lg px-5 py-3">Save homepage</button></form>`;editor.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await db.collection('siteSettings').doc('homepage').set(Object.fromEntries(f.entries()),{merge:true});say('Homepage content saved.');};}
async function aboutEditor(){const snap=await db.collection('siteSettings').doc('about').get(),d=snap.exists?snap.data():{};editor.innerHTML=`<h3 class="text-xl font-semibold mb-4">About us</h3><form id="aboutForm">${field('Section heading','title',d.title||'')}${textarea('Company description','description',d.description||'')}${field('Photo URL','image',d.image||'')}<button class="bg-stone-900 text-white rounded-lg px-5 py-3">Save about section</button></form>`;editor.querySelector('form').onsubmit=async e=>{e.preventDefault();await db.collection('siteSettings').doc('about').set(Object.fromEntries(new FormData(e.target).entries()),{merge:true});say('About section saved.');};}
const defs={services:{col:'siteServices',title:'Services',fields:[['Service name','title'],['Description','desc','textarea'],['Image URL','image'],['Included items (separate with commas)','included','textarea']]},gallery:{col:'siteGallery',title:'Gallery photos',fields:[['Photo title','title'],['Category','category'],['Description','desc','textarea'],['Image URL','image']]},catalog:{col:'siteCatalog',title:'Packages & decor items',fields:[['Item / package name','name'],['Category','category'],['Price (e.g. ₹25,000)','price'],['Description','desc','textarea'],['Image URL','image']]}};
async function collectionEditor(tab){const def=defs[tab];const snap=await db.collection(def.col).orderBy('order').get().catch(()=>null);const items=snap?snap.docs.map(x=>({id:x.id,...x.data()})):[];editor.innerHTML=`<div class="flex flex-wrap justify-between items-center gap-3 mb-5"><div><h3 class="text-xl font-semibold">${def.title}</h3><p class="text-sm text-stone-500">Add, edit or remove items. You can upload an image or paste an image URL.</p></div><button id="add" class="bg-stone-900 text-white rounded-lg px-4 py-2">+ Add new</button></div><div id="formWrap" class="hidden border rounded-xl p-4 mb-5"></div><div class="grid md:grid-cols-2 gap-3">${items.map(x=>`<article class="border rounded-xl p-4 flex gap-3"><img src="${esc(x.image)}" class="w-24 h-24 object-cover rounded-lg bg-stone-100" onerror="this.style.display='none'"><div class="min-w-0 flex-1"><b>${esc(x.title||x.name)}</b><p class="text-sm text-stone-500">${esc(x.category||'')} ${esc(x.price||'')}</p><p class="text-xs text-stone-500 line-clamp-2">${esc(x.desc||'')}</p><div class="flex gap-3 mt-3"><button class="edit text-sm underline" data-id="${x.id}">Edit</button><button class="delete text-sm text-red-700 underline" data-id="${x.id}">Delete</button></div></div></article>`).join('')}</div>`;document.getElementById('add').onclick=()=>itemForm(tab,null);editor.querySelectorAll('.edit').forEach(b=>b.onclick=()=>itemForm(tab,items.find(x=>x.id===b.dataset.id)));editor.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{if(confirm('Delete this item?')){await db.collection(def.col).doc(b.dataset.id).delete();say('Item deleted.');collectionEditor(tab);}});}
async function itemForm(tab,item){const def=defs[tab],wrap=document.getElementById('formWrap');editingId=item?.id||null;wrap.classList.remove('hidden');wrap.innerHTML=`<h4 class="font-semibold mb-3">${item?'Edit':'Add'} ${def.title}</h4><form id="itemForm">${def.fields.map(([label,name,type])=>type==='textarea'?textarea(label,name,name==='included'?(item?.[name]||[]).join(', '):(item?.[name]||'')):field(label,name,item?.[name]||'')).join('')}<label class="block text-sm mb-3">Upload image<input id="imageFile" type="file" accept="image/*" class="block mt-2"></label><div class="flex gap-2"><button class="bg-stone-900 text-white rounded-lg px-4 py-2">Save</button><button type="button" id="cancel" class="border rounded-lg px-4 py-2">Cancel</button></div></form>`;document.getElementById('cancel').onclick=()=>wrap.classList.add('hidden');document.getElementById('itemForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target).entries());if(f.included)f.included=f.included.split(',').map(x=>x.trim()).filter(Boolean);if(f.order==='')delete f.order;let image=f.image||item?.image||'';const file=document.getElementById('imageFile').files[0];if(file){if(file.size>5*1024*1024){say('Please choose an image smaller than 5 MB.');return;}const path=`site-media/${tab}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const ref=storage.ref(path);say('Uploading image…');await ref.put(file,{contentType:file.type});image=await ref.getDownloadURL();}f.image=image;f.order=Number(item?.order??Date.now());const col=db.collection(def.col);if(item)await col.doc(item.id).set(f,{merge:true});else await col.add(f);say('Saved successfully.');collectionEditor(tab);};}
async function loadEnquiries(){editor.innerHTML='<h3 class="text-xl font-semibold mb-4">Customer enquiries</h3><p>Loading…</p>';try{const s=await db.collection('inquiries').orderBy('createdAt','desc').limit(100).get();editor.innerHTML='<h3 class="text-xl font-semibold mb-4">Customer enquiries</h3>'+ (s.empty?'<p>No enquiries yet.</p>':s.docs.map(doc=>{const d=doc.data();return `<article class="border rounded-xl p-4 mb-3"><b>${esc(d.name)}</b><p class="text-sm text-stone-600">${esc(d.email)} · ${esc(d.phone)} · ${esc(d.eventType)} · ${esc(d.date)}</p><p class="text-sm mt-2">${esc(d.notes)}</p></article>`;}).join(''));}catch(e){editor.innerHTML='<p class="text-red-700">Could not load enquiries. Check Firestore rules.</p>';}}
</script></body></html>
