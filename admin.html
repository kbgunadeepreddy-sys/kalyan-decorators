<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalyan Decorators | Private Admin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script></head>
<body class="min-h-screen bg-stone-100 text-stone-900"><main class="max-w-5xl mx-auto p-5 md:p-10"><header class="flex items-center justify-between mb-8"><div><p class="text-xs tracking-[.3em] uppercase text-amber-700">Private workspace</p><h1 class="text-3xl font-serif">Kalyan Decorators</h1></div><a href="/" class="text-sm underline">View public website</a></header>
<section id="login" class="max-w-md mx-auto bg-white rounded-2xl shadow p-7"><h2 class="text-xl font-semibold mb-2">Administrator sign in</h2><p class="text-sm text-stone-500 mb-5">This area is restricted to authorized business administrators.</p><form id="loginForm" class="space-y-3"><input id="email" type="email" required placeholder="Admin email" class="w-full border rounded-lg p-3"><input id="password" type="password" required placeholder="Password" class="w-full border rounded-lg p-3"><button class="w-full bg-stone-900 text-white rounded-lg p-3">Sign in</button></form><p id="loginError" class="text-sm text-red-700 mt-3" role="alert"></p></section>
<section id="dashboard" class="hidden"><div class="flex flex-wrap justify-between items-center gap-3 mb-5"><div><h2 class="text-2xl font-semibold">Customer enquiries</h2><p class="text-sm text-stone-500">Private records stored in Firestore.</p></div><button id="logout" class="border rounded-lg px-4 py-2">Sign out</button></div><div id="status" class="text-sm text-stone-600 mb-4" aria-live="polite"></div><div id="leads" class="space-y-3"></div></section></main>
<script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyC_xBOGExLfpVkVbx4vDnUg2MTv9z82Ys4",
  authDomain: "kalyan-decorators.firebaseapp.com",
  projectId: "kalyan-decorators",
  storageBucket: "kalyan-decorators.firebasestorage.app",
  messagingSenderId: "579489792336",
  appId: "1:579489792336:web:5e5538d8b6375272642c55",
  measurementId: "G-E94NVE123J"
};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
const login=document.getElementById('login'),dashboard=document.getElementById('dashboard'),err=document.getElementById('loginError');
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();err.textContent='Signing in…';try{await auth.signInWithEmailAndPassword(email.value.trim(),password.value)}catch(x){err.textContent='Sign-in failed. Check your credentials and Firebase Authentication setup.';}});
document.getElementById('logout').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async user=>{const allowedUser=!!user && user.uid==='A873gDM5ZoO52w1BpPTMYePyvzN2';login.classList.toggle('hidden',allowedUser);dashboard.classList.toggle('hidden',!allowedUser);if(user && !allowedUser){await auth.signOut();err.textContent='This account is not authorized for the admin panel.';return;}if(!allowedUser)return;document.getElementById('status').textContent='Loading enquiries…';try{const snap=await db.collection('inquiries').orderBy('createdAt','desc').limit(100).get();const root=document.getElementById('leads');root.innerHTML='';if(snap.empty){root.textContent='No enquiries received yet.';}snap.forEach(doc=>{const d=doc.data(),card=document.createElement('article');card.className='bg-white rounded-xl shadow-sm border p-5';const title=document.createElement('h3');title.className='font-semibold text-lg';title.textContent=d.name||'Customer';const body=document.createElement('p');body.className='text-sm text-stone-600 mt-2 whitespace-pre-wrap';body.textContent=[d.eventType,d.date,d.phone,d.email,'Guests: '+d.guests,'Budget: '+d.budget,'Venue: '+d.venue,'Notes: '+(d.notes||'—'),'Shortlist: '+((d.shortlist||[]).map(x=>x.name).join(', ')||'None')].join(' · ');card.append(title,body);root.append(card);});document.getElementById('status').textContent=snap.size+' latest enquiries';}catch(x){console.error(x);document.getElementById('status').textContent='Unable to load enquiries. Confirm Firestore rules and that this account is an authorized admin.';}});
</script></body></html>
